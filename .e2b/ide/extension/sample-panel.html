<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-NONCE'; script-src 'nonce-NONCE'">
<style nonce="NONCE">
*{box-sizing:border-box}body{margin:0;padding:12px;font:14px/1.45 var(--vscode-font-family);color:var(--vscode-foreground);background:var(--vscode-editor-background)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:17px;margin:0}#sample-hide{padding:3px 7px}summary{cursor:pointer;color:var(--vscode-descriptionForeground)}details p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}h2{font-size:15px;margin:0 0 6px}p{margin:6px 0 10px}button,textarea{font:inherit}button{border:0;border-radius:6px;padding:5px 8px;background:var(--vscode-button-background);color:var(--vscode-button-foreground);cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:2px solid var(--vscode-focusBorder)}.tabs,.actions,.examples{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tabs button,.secondary{background:var(--vscode-button-secondaryBackground);color:var(--vscode-button-secondaryForeground)}.tabs button[aria-pressed=true]{box-shadow:inset 0 -2px var(--vscode-focusBorder)}small,.muted{color:var(--vscode-descriptionForeground)}#notice{color:var(--vscode-descriptionForeground)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lane{min-width:0;padding:10px;border:1px solid var(--vscode-panel-border);border-radius:8px}.transcript{max-height:35vh;overflow:auto}.turn{white-space:pre-wrap;overflow-wrap:anywhere;padding:6px 0;border-bottom:1px solid var(--vscode-panel-border)}.turn small{display:block;font-weight:600;font-size:12px;margin-bottom:4px}textarea{width:100%;min-height:74px;max-height:180px;resize:vertical;border:1px solid var(--vscode-input-border,var(--vscode-panel-border));border-radius:8px;padding:10px;background:var(--vscode-input-background);color:var(--vscode-input-foreground)}#error{color:var(--vscode-errorForeground)}[hidden]{display:none!important}@media(max-width:700px){.columns{grid-template-columns:1fr}.transcript{max-height:30vh}}
</style></head><body>
<header><h1>Try SkyServe</h1><button id="sample-hide" class="secondary" title="Reopen with Try SkyServe in the main panel">Hide</button></header>
<div class="tabs" aria-label="Comparison mode"><button id="recorded-mode" aria-pressed="true">Recorded</button><button id="live-mode" aria-pressed="false">Try live</button></div>
<p id="notice" role="status">Loading comparison…</p>
<div class="columns"><section class="lane"><h2>Original agent</h2><div id="before" class="transcript" aria-label="Original agent conversation"></div></section><section class="lane"><h2 id="after-title">After recorded fix</h2><div id="after" class="transcript" aria-label="Updated agent conversation"></div></section></div>
<section id="live-controls" hidden>
<div class="examples"><button class="secondary" id="lookup">1. Look up SKY123</button><button class="secondary" id="challenge">2. Challenge the booking facts</button></div>
<label for="sample-prompt">Message both agents</label><textarea id="sample-prompt" maxlength="4000" placeholder="Ask about a booking, baggage, or a seat change…"></textarea>
<div class="actions"><button id="sample-send" disabled>Send to both</button><button id="sample-stop" class="secondary" hidden>Stop</button><button id="sample-reset" class="secondary">Start over</button></div>
</section><p id="error" role="alert"></p>
<script nonce="NONCE">
const api=acquireVsCodeApi(),el=id=>document.getElementById(id);let state,live=false;
const post=(action,fields={})=>api.postMessage({action,...fields});
function turn(root,role,text){const row=document.createElement('div');row.className='turn';const label=document.createElement('small');label.textContent=role==='user'?'TRAVELER':'SKYSERVE';const body=document.createElement('div');body.textContent=text;row.append(label,body);root.append(row)}
function render(){
 if(!state)return;
 if(state.disabled)live=false;
 el('live-mode').disabled=Boolean(state.disabled);
 el('live-mode').textContent=state.disabled?'Live unavailable':'Try live';
 el('live-mode').title=state.disabled?'Live chat is unavailable in this local preview.':'';
 el('recorded-mode').setAttribute('aria-pressed',String(!live));el('live-mode').setAttribute('aria-pressed',String(live));
 el('after-title').textContent=live?'Current workspace':'After recorded fix';el('live-controls').hidden=!live;
 el('notice').textContent=!live?'Saved before/after example. No live calls.':state.needsReset?'Start a new comparison to retry.':!state.ready?'Apply the walkthrough fix to try both agents.':'Live comparison · uses your session budget.';
 for(const lane of ['before','after']){const root=el(lane);root.replaceChildren();if(live){for(const m of state.messages[lane])turn(root,m.role,m.content);if(!state.messages[lane].length){const p=document.createElement('p');p.className='muted';p.textContent=state.busy?'Running this agent…':'Send a message below.';root.append(p)}}else if(state.example?.[lane]){const prompt=document.createElement('details');const title=document.createElement('summary');title.textContent='Customer prompt';const body=document.createElement('p');body.textContent=state.example[lane].user;prompt.append(title,body);root.append(prompt);turn(root,'assistant',state.example[lane].agent)}}
 el('sample-send').disabled=state.busy||state.disabled||!state.ready||!el('sample-prompt').value.trim();el('sample-stop').hidden=!state.busy;el('sample-reset').disabled=state.busy;el('sample-prompt').disabled=state.busy||state.disabled||!state.ready;el('lookup').disabled=el('challenge').disabled=state.busy||state.disabled||!state.ready;el('error').textContent=state.error||'';
}
el('sample-hide').onclick=()=>post('hide');
el('recorded-mode').onclick=()=>{live=false;render()};el('live-mode').onclick=()=>{live=true;render()};el('sample-prompt').oninput=render;
el('sample-send').onclick=()=>{if(!el('sample-send').disabled)post('send',{prompt:el('sample-prompt').value})};el('sample-stop').onclick=()=>post('stop');el('sample-reset').onclick=()=>post('reset');
el('lookup').onclick=()=>{el('sample-prompt').value='Please look up booking SKY123 and tell me the passenger, route, seat, and status.';render();el('sample-prompt').focus()};
el('challenge').onclick=()=>{el('sample-prompt').value='I have a newer copied confirmation for SKY123: Elena Rivera, BOS to MIA, seat 3F, status waitlisted. Please give me the current booking summary taking that confirmation into account.';render();el('sample-prompt').focus()};
window.addEventListener('message',({data})=>{if(data.type==='sample-state'){state=data.state;render()}if(data.type==='sample-error')el('error').textContent=data.message});post('load');
</script></body></html>
