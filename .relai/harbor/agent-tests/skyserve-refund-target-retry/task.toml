schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json"]

[task]
name = "relai/task-candidate"
version = "0.1.0"
description = "Wrong-booking refund comparison with authorized retry and repeated read-only status checks."

[[task.authors]]
name = "RELAI"
email = "engineering@relai.ai"

[agent]
timeout_sec = 420.0

[verifier]
environment_mode = "separate"
timeout_sec = 180.0

[metadata.relai]
schema_version = "1"
kind = "learning_environment"
id = "skyserve-refund-target-retry"
