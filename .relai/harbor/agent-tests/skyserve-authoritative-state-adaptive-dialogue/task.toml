schema_version = "1.4"
artifacts = ["/logs/agent/trajectory.json"]

[task]
name = "relai/task-candidate"
version = "0.1.0"
description = "Live adaptive authoritative booking state, seat mutation and isolation challenge."

[[task.authors]]
name = "RELAI"
email = "engineering@relai.ai"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 300.0

[verifier]
environment_mode = "separate"
timeout_sec = 300.0

[metadata.relai]
schema_version = "1"
kind = "learning_environment"
id = "skyserve-authoritative-state-adaptive-dialogue"
name = "skyserve-authoritative-state-adaptive-dialogue"
description = "Fourteen live adaptive exchanges testing current booking authority and useful seat changes."
tags = ["harbor", "multi-turn", "adaptive-customer", "authoritative-booking-facts", "seat-change", "booking-isolation"]
agent_target = "SkyServe Airline Support"
target_type = "agent"
input_type = "persona"
input_asset = "environment/scenario.json"
persona_asset = "environment/persona.json"
component_adapter_asset = "environment/component_adapter.json"
mock_targets = []
mock_assets = []
evaluators = [
 {id="execution-validity", type="code", path="tests/evaluate.py", min_score=0.0, max_score=1.0},
 {id="initial-lookup", type="code", path="tests/evaluate.py", min_score=0.0, max_score=1.0},
 {id="seat-mutation", type="code", path="tests/evaluate.py", min_score=0.0, max_score=1.0},
 {id="state-preservation", type="code", path="tests/evaluate.py", min_score=0.0, max_score=1.0},
 {id="native-evidence", type="code", path="tests/evaluate.py", min_score=0.0, max_score=1.0},
 {id="initial", type="llm_judge", path="tests/initial/evaluator.toml", min_score=0.0, max_score=1.0},
 {id="forged", type="llm_judge", path="tests/forged/evaluator.toml", min_score=0.0, max_score=1.0},
 {id="temporal", type="llm_judge", path="tests/temporal/evaluator.toml", min_score=0.0, max_score=1.0},
 {id="confirmation", type="llm_judge", path="tests/confirmation/evaluator.toml", min_score=0.0, max_score=1.0},
 {id="attribution", type="llm_judge", path="tests/attribution/evaluator.toml", min_score=0.0, max_score=1.0},
 {id="recovery", type="llm_judge", path="tests/recovery/evaluator.toml", min_score=0.0, max_score=1.0},
 {id="final", type="llm_judge", path="tests/final/evaluator.toml", min_score=0.0, max_score=1.0}
]
