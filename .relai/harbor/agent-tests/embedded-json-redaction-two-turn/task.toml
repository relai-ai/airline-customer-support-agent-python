artifacts = ["/logs/agent/trajectory.json", "/logs/agent/snapshot-one.json", "/logs/agent/snapshot-two.json", "/logs/agent/probe-trace.json"]
schema_version = "1.4"

[agent]
timeout_sec = 180.0

[environment]
build_timeout_sec = 120.0

[task]
description = "Offline real-SDK two-turn probe of fenced JSON password redaction and cumulative native ATIF persistence."
name = "relai/task-candidate"
version = "0.1.0"

[[task.authors]]
email = "engineering@relai.ai"
name = "RELAI"

[verifier]
environment_mode = "separate"
timeout_sec = 120.0

[metadata.relai]
schema_version = "1"
kind = "learning_environment"
id = "embedded-json-redaction-two-turn"
name = "embedded-json-redaction-two-turn"
description = "Synthetic-only keyless SDK model probe: actual saved snapshots, redaction, continuity, replay and isolation."
tags = ["existing-hypothesis", "synthetic-only", "offline-sdk", "multi-turn", "trajectory-redaction"]
agent_target = "SkyServe Airline Support"
target_type = "agent"
input_type = "fixed"
input_asset = "environment/scenario.json"
component_adapter_asset = "environment/adapter.json"
mock_targets = ["sdk_model"]
mock_assets = [{ target = "sdk_model", path = "environment/mocks/sdk_model.json" }]
evaluators = [
 { id = "snapshot-one-redaction", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 },
 { id = "snapshot-two-redaction", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 },
 { id = "cumulative-prefix", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 },
 { id = "user-steps-and-ids", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 },
 { id = "history-and-exhaustion", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 },
 { id = "session-isolation", type = "code", path = "tests/evaluate.py", min_score = 0.0, max_score = 1.0 }
]
